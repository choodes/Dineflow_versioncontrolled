<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Display System (KDS) — Dineflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/kds.css">
<script src="/js/formatters.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<style>
  .kds-clock {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 600;
    color: #CBD5E0;
    background: #25252D;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
  }
</style>
</head>
<body class="kds-theme">

<header class="app-header">
  <div style="display: flex; align-items: center; gap: 12px;">
    <span style="font-size: 22px;">👨‍🍳</span>
    <div>
      <h1 class="brand-title">Kitchen Display System</h1>
      <div class="header-sub">Live Production Dispatch</div>
    </div>
  </div>
  <div class="header-actions">
    <span class="kds-clock" id="kds-clock">--:--:--</span>
    <button id="sound-toggle-btn" class="ui-btn secondary small" style="color: #CBD5E0; border-color: #383844;">
      🔊 Sound Alerts: ON
    </button>
    <a href="/logout" class="logout-btn">Sign Out</a>
  </div>
</header>

<main class="layout-wrap" style="max-width: 1200px;">
  <div class="section-heading" style="color: #A0AEC0;">
    Active Kitchen Tickets (<span id="ticket-count">0</span>)
  </div>
  <div id="queue" class="kds-grid">
    <div style="color: #718096; text-align: center; padding: 60px 0; grid-column: 1/-1;">
      Connecting to order queue…
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);

let soundEnabled = true;
$('#sound-toggle-btn').onclick = () => {
  soundEnabled = !soundEnabled;
  $('#sound-toggle-btn').textContent = soundEnabled ? '🔊 Sound Alerts: ON' : '🔇 Sound Alerts: OFF';
};

// Web Audio API Synthesizer Chime for new tickets (no external audio files needed)
function playNewOrderChime() {
  if (!soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12); // A5
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  } catch (e) {}
}

let knownOrderIds = new Set();
let orderReceivedTimes = new Map(); // orderId -> timestamp

function getUrgencyLevel(elapsedMinutes) {
  if (elapsedMinutes >= 15) return 'urgency-rush';
  if (elapsedMinutes >= 7) return 'urgency-warning';
  return 'urgency-normal';
}

async function loadQueue() {
  try {
    const orders = await api('GET', '/api/kitchen/queue');
    const box = $('#queue');
    $('#ticket-count').textContent = orders.length;

    // Detect new orders for audio alert
    let hasNew = false;
    const currentIds = new Set();
    orders.forEach(o => {
      currentIds.add(o.id);
      if (!orderReceivedTimes.has(o.id)) {
        orderReceivedTimes.set(o.id, Date.now());
      }
      if (!knownOrderIds.has(o.id) && knownOrderIds.size > 0) {
        hasNew = true;
      }
    });
    knownOrderIds = currentIds;
    if (hasNew) playNewOrderChime();

    if (!orders.length) {
      box.innerHTML = `
        <div style="color: #718096; text-align: center; padding: 70px 0; grid-column: 1/-1;">
          <div style="font-size: 32px; margin-bottom: 8px;">✅</div>
          <div style="font-size: 16px; font-weight: 500; color: #E2E8F0;">Kitchen Queue is Clear</div>
          <div style="font-size: 13px; margin-top: 4px;">All orders have been prepared and dispatched.</div>
        </div>`;
      return;
    }

    box.innerHTML = orders.map(o => {
      const startTime = orderReceivedTimes.get(o.id) || Date.now();
      const elapsedMins = Math.floor((Date.now() - startTime) / 60000);
      const elapsedSecs = Math.floor(((Date.now() - startTime) % 60000) / 1000);
      const timerText = `${String(elapsedMins).padStart(2, '0')}:${String(elapsedSecs).padStart(2, '0')}`;
      const urgencyClass = getUrgencyLevel(elapsedMins);

      return `
        <div class="kds-ticket ${urgencyClass}">
          <div>
            <div class="kds-header">
              <div>
                <span class="kds-order-num">#${o.id}</span>
                <span style="font-size: 12px; color: #A0AEC0; margin-left: 6px;">Session #${o.sessionId}</span>
              </div>
              <span class="kds-timer-badge">⏱ ${timerText}</span>
            </div>

            <ul class="kds-item-list">
              ${o.items.map((i, idx) => `
                <li class="kds-item-row" data-check="${o.id}-${idx}">
                  <span class="kds-item-qty">${i.quantity}×</span>
                  <span class="kds-item-name">${escapeHtml(i.nameSnapshot)}</span>
                </li>
              `).join('')}
            </ul>
          </div>

          <div class="kds-actions">
            ${o.status === 'PLACED' ? `
              <button class="ui-btn herb" data-accept="${o.id}">Accept Order</button>
              <button class="ui-btn paprika" data-reject="${o.id}">Reject</button>
            ` : `
              <button class="ui-btn stone full-width" style="background: #2D3748;" data-ready="${o.id}">
                ✓ Mark Ready to Serve
              </button>
            `}
          </div>
        </div>
      `;
    }).join('');

    // Toggle strikethrough checklist
    box.querySelectorAll('.kds-item-row').forEach(row => {
      row.onclick = () => row.classList.toggle('completed');
    });

    box.querySelectorAll('[data-accept]').forEach(b => {
      b.onclick = async () => {
        await api('POST', '/api/kitchen/orders/' + b.dataset.accept + '/accept');
        loadQueue();
      };
    });

    box.querySelectorAll('[data-reject]').forEach(b => {
      b.onclick = async () => {
        const reason = prompt('Reason for rejecting order (e.g. ingredient out of stock)?', 'Item out of stock');
        if (reason === null) return;
        await api('POST', '/api/kitchen/orders/' + b.dataset.reject + '/reject', { reason });
        loadQueue();
      };
    });

    box.querySelectorAll('[data-ready]').forEach(b => {
      b.onclick = async () => {
        await api('POST', '/api/kitchen/orders/' + b.dataset.ready + '/ready');
        loadQueue();
      };
    });
  } catch (e) {
    console.error('Queue sync error:', e);
  }
}

// Clock tick
function tickClock() {
  $('#kds-clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
}
setInterval(tickClock, 1000);
tickClock();

loadQueue();
setInterval(loadQueue, 3500);
</script>
</body>
</html>
