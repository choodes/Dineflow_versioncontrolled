<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Display</title>
<style>
  :root{ --paper:#FAF6EE; --charcoal:#211F1C; --paprika:#C1440E; --herb:#2F5233; --stone:#8A8578; --line:#E4DDC9; --card:#FFFFFF; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--charcoal); font-family:system-ui,-apple-system,sans-serif;}
  header{background:var(--charcoal); color:var(--paper); padding:18px 24px; display:flex; justify-content:space-between; align-items:center;}
  header h1{margin:0; font-size:20px;}
  main{max-width:1100px; margin:0 auto; padding:20px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; transition:box-shadow .15s ease, transform .15s ease;}
  .card:hover{box-shadow:0 3px 14px rgba(0,0,0,.08); transform:translateY(-1px);}
  .card.placed{border-left:5px solid #B8860B;}
  .card.accepted{border-left:5px solid #0C5460;}
  .row{display:flex; justify-content:space-between; align-items:center;}
  .badge{padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600;}
  .badge.placed{background:#FFF3CD; color:#856404;}
  .badge.accepted{background:#D1ECF1; color:#0C5460;}
  ul{margin:10px 0; padding-left:18px; font-size:14px;}
  .btn{border:none; border-radius:8px; padding:9px 14px; font-weight:600; cursor:pointer; font-size:13px;}
  .btn.herb{background:var(--herb); color:#fff;}
  .btn.paprika{background:var(--paprika); color:#fff;}
  .btn.stone{background:var(--stone); color:#fff;}
  .actions{display:flex; gap:8px; margin-top:12px;}
  .empty{color:var(--stone); text-align:center; padding:60px 0; font-size:14px;}
  .pulse{animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.55;}100%{opacity:1;}}
</style>
</head>
<body>
<header>
  <h1>👨‍🍳 Kitchen Display</h1>
  <div style="display:flex;align-items:center;gap:14px;">
    <span id="clock" style="font-family:monospace;font-size:13px;"></span>
    <a href="/logout" style="color:var(--paper);font-size:12px;opacity:.8;">Logout</a>
  </div>
</header>
<main>
  <div id="queue" class="grid"><div class="empty">Loading...</div></div>
</main>

<script>
const $ = s => document.querySelector(s);
async function api(method, path, body){
  const res = await fetch(path, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined });
  if(!res.ok){
    let message = res.statusText;
    try{ const errBody = await res.json(); message = errBody.error || message; }catch(e){ /* not JSON, keep statusText */ }
    throw new Error(message);
  }
  const ct = res.headers.get('content-type')||'';
  return ct.includes('application/json') ? res.json() : null;
}

async function loadQueue(){
  const orders = await api('GET', '/api/kitchen/queue');
  const box = $('#queue');
  if(!orders.length){ box.innerHTML = '<div class="empty">No active orders — kitchen is clear ✅</div>'; return; }

  box.innerHTML = orders.map(o => `
    <div class="card ${o.status.toLowerCase()} ${o.status==='PLACED' ? 'pulse' : ''}">
      <div class="row">
        <strong>Order #${o.id}</strong>
        <span class="badge ${o.status.toLowerCase()}">${o.status}</span>
      </div>
      <div style="font-size:12px;color:var(--stone);">Session #${o.sessionId}</div>
      <ul>${o.items.map(i => `<li>${i.quantity} × ${i.nameSnapshot}</li>`).join('')}</ul>
      <div class="actions">
        ${o.status==='PLACED' ? `
          <button class="btn herb" data-accept="${o.id}">Accept</button>
          <button class="btn paprika" data-reject="${o.id}">Reject</button>
        ` : `
          <button class="btn stone" data-ready="${o.id}">Mark Ready for Pickup</button>
        `}
      </div>
    </div>
  `).join('');

  box.querySelectorAll('[data-accept]').forEach(b => b.onclick = async () => {
    await api('POST', '/api/kitchen/orders/' + b.dataset.accept + '/accept');
    loadQueue();
  });
  box.querySelectorAll('[data-reject]').forEach(b => b.onclick = async () => {
    const reason = prompt('Reason for rejecting this order?', 'Item out of stock');
    if(reason === null) return;
    await api('POST', '/api/kitchen/orders/' + b.dataset.reject + '/reject', { reason });
    loadQueue();
  });
  box.querySelectorAll('[data-ready]').forEach(b => b.onclick = async () => {
    await api('POST', '/api/kitchen/orders/' + b.dataset.ready + '/ready');
    loadQueue();
  });
}

function tickClock(){ $('#clock').textContent = new Date().toLocaleTimeString(); }
setInterval(tickClock, 1000); tickClock();

loadQueue();
setInterval(loadQueue, 4000);
</script>
</body>
</html>
