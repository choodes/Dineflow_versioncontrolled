<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waiter Service Station — Dineflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/waiter.css">
<script src="/js/formatters.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
</head>
<body>

<header class="app-header">
  <div style="display: flex; align-items: center; gap: 12px;">
    <span style="font-size: 22px;">🧑‍🍳</span>
    <div>
      <h1 class="brand-title">Waiter Service Station</h1>
      <div class="header-sub">Floor &amp; Delivery Management</div>
    </div>
  </div>
  <div class="header-actions">
    <a href="/logout" class="logout-btn">Sign Out</a>
  </div>
</header>

<main class="layout-wrap">

  <!-- Phone Search Card for Counter Pickup -->
  <div class="search-card">
    <h3 style="font-size: 16px; margin: 0 0 8px;">Find Bill by Customer Phone</h3>
    <div class="search-input-group">
      <input id="phone-search-input" placeholder="Enter guest's 10-digit mobile number" maxlength="10">
      <button class="ui-btn herb" id="phone-search-btn">Look Up Bill</button>
    </div>
    <div id="phone-search-results" style="margin-top: 14px;"></div>
  </div>

  <!-- Table Floor Plan Visual Matrix -->
  <div class="section-heading">
    <span>Table Matrix &amp; Floor Overview</span>
    <span style="font-size: 11px; text-transform: none; color: var(--ink-muted); font-weight: normal;">
      (Red indicates 25+ min idle without orders)
    </span>
  </div>
  <div id="table-matrix" class="table-matrix-grid">
    <div style="color: var(--ink-muted); padding: 18px 0; font-size: 13px;">Loading table matrix...</div>
  </div>

  <div class="cards-columns-grid">
    <!-- Ready to Deliver Section -->
    <div>
      <div class="section-heading">Ready for Table Delivery</div>
      <div id="deliveries">
        <div style="color: var(--ink-muted); font-size: 13px;">Checking pickup station...</div>
      </div>
    </div>

    <!-- Waiter Calls Section -->
    <div>
      <div class="section-heading">Waiter Calls &amp; Floor Alerts</div>
      <div id="calls">
        <div style="color: var(--ink-muted); font-size: 13px;">No open calls...</div>
      </div>
    </div>
  </div>

</main>

<script>
const $ = s => document.querySelector(s);

// Deliveries
async function loadDeliveries() {
  const items = await api('GET', '/api/waiter/deliveries/ready');
  const box = $('#deliveries');
  if (!items.length) {
    box.innerHTML = `
      <div class="ui-card" style="text-align: center; color: var(--ink-muted); padding: 24px 14px;">
        ✓ All cooked dishes have been served to tables.
      </div>`;
    return;
  }

  box.innerHTML = items.map(d => `
    <div class="ui-card" style="border-left: 5px solid var(--brand-herb);">
      <div class="flex-between">
        <strong class="mono-font" style="font-size: 15px;">Order #${d.orderId}</strong>
        <span class="ui-badge ready">Ready</span>
      </div>
      <div style="font-size: 12px; color: var(--ink-muted); margin-top: 2px;">Session #${d.sessionId}</div>
      <ul style="margin: 10px 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-primary);">
        ${d.items.map(i => `<li><strong>${i.quantity}×</strong> ${escapeHtml(i.nameSnapshot)}</li>`).join('')}
      </ul>
      <button class="ui-btn herb full-width small" data-served="${d.orderId}">
        ✓ Confirm Plated to Table
      </button>
    </div>
  `).join('');

  box.querySelectorAll('[data-served]').forEach(b => {
    b.onclick = async () => {
      await api('POST', '/api/waiter/orders/' + b.dataset.served + '/served');
      showToast('Order marked served');
      loadDeliveries();
    };
  });
}

// Calls & Alerts
const callTypeLabels = {
  CUSTOMER_CALL: '🔔 Guest Called Server',
  PAYMENT_COLLECT: '💵 Payment Settle Request',
  REGULAR_CHECK: '⏰ 25-Min Idle Check-in'
};

async function loadCalls() {
  const calls = await api('GET', '/api/waiter/calls');
  const box = $('#calls');
  if (!calls.length) {
    box.innerHTML = `
      <div class="ui-card" style="text-align: center; color: var(--ink-muted); padding: 24px 14px;">
        🔕 No pending alerts or service calls.
      </div>`;
    return;
  }

  box.innerHTML = calls.map(c => `
    <div class="ui-card" style="border-left: 5px solid ${c.type === 'PAYMENT_COLLECT' ? 'var(--brand-herb)' : 'var(--brand-paprika)'};">
      <div class="flex-between">
        <strong style="font-size: 14.5px;">${callTypeLabels[c.type] || c.type}</strong>
        <span class="ui-badge ${c.status.toLowerCase()}">${c.status}</span>
      </div>
      <div style="font-size: 12.5px; color: var(--ink-secondary); margin: 6px 0 12px;">
        Table #${c.tableId} · Session #${c.sessionId}
      </div>
      <div class="flex-wrap">
        ${c.status === 'OPEN' ? `
          <button class="ui-btn secondary small" data-attend="${c.id}">Attend</button>
        ` : ''}
        ${c.type === 'PAYMENT_COLLECT' ? `
          <button class="ui-btn herb small" data-paid="${c.id}">Confirm Paid &amp; Close</button>
        ` : `
          <button class="ui-btn paprika small" data-resolve="${c.id}">Resolve Alert</button>
        `}
      </div>
    </div>
  `).join('');

  box.querySelectorAll('[data-attend]').forEach(b => {
    b.onclick = async () => {
      await api('POST', '/api/waiter/calls/' + b.dataset.attend + '/attend');
      loadCalls();
    };
  });

  box.querySelectorAll('[data-paid]').forEach(b => {
    b.onclick = async () => {
      await api('POST', '/api/waiter/calls/' + b.dataset.paid + '/mark-paid');
      showToast('Payment confirmed and table closed!');
      refreshAll();
    };
  });

  box.querySelectorAll('[data-resolve]').forEach(b => {
    b.onclick = async () => {
      await api('POST', '/api/waiter/calls/' + b.dataset.resolve + '/resolve');
      loadCalls();
    };
  });
}

// Floor Table Matrix
async function loadSessionsOverview() {
  const sessions = await api('GET', '/api/waiter/sessions');
  const matrix = $('#table-matrix');
  if (!sessions.length) {
    matrix.innerHTML = `<div style="grid-column: 1/-1; color: var(--ink-muted);">All tables are currently open &amp; available.</div>`;
    return;
  }

  matrix.innerHTML = sessions.map(s => {
    let statusClass = 'status-active';
    let statusText = 'Active Dining';
    if (s.needsAttention) {
      statusClass = 'status-idle-alert';
      statusText = '⚠️ Idle 25+ min';
    } else if (s.status === 'BILL_REQUESTED') {
      statusClass = 'status-bill';
      statusText = 'Bill Requested';
    } else if (s.status === 'CLOSED') {
      statusClass = 'status-closed';
      statusText = 'Closed';
    }

    return `
      <div class="table-matrix-card ${statusClass}">
        <div class="matrix-card-header">
          <span class="matrix-table-title">Table ${s.tableId}</span>
          <span class="price-tag" style="font-size: 15px;">${money(s.total)}</span>
        </div>
        <div class="matrix-card-body">
          <div>Status: <strong>${statusText}</strong></div>
          <div>Party: <strong>${s.partySize || '—'} guests</strong></div>
          <div>Phone: <strong>${formatPhone(s.customerPhone)}</strong></div>
          <div style="font-size: 11px; color: var(--ink-muted); margin-top: 4px;">Last order: ${s.minutesSinceLastOrder}m ago</div>
        </div>
      </div>
    `;
  }).join('');
}

// Counter Phone Search
async function searchByPhone() {
  const phone = $('#phone-search-input').value.trim();
  const box = $('#phone-search-results');
  if (!phone) { box.innerHTML = ''; return; }

  const results = await api('GET', '/api/waiter/sessions/search?phone=' + encodeURIComponent(phone));
  if (!results.length) {
    box.innerHTML = `<div style="color: var(--brand-paprika); font-size: 13px;">No open sessions located for this mobile number.</div>`;
    return;
  }

  box.innerHTML = results.map(s => `
    <div class="ui-card flex-between" style="border-left: 5px solid var(--brand-herb); margin-bottom: 8px;">
      <div>
        <strong>Table ${s.tableId} — Session #${s.id}</strong>
        <div style="font-size: 12px; color: var(--ink-muted);">
          ${s.status} · ${s.partySize || '?'} guests · last ordered ${s.minutesSinceLastOrder}m ago
        </div>
      </div>
      <span class="price-tag" style="font-size: 18px;">${money(s.total)}</span>
    </div>
  `).join('');
}

$('#phone-search-btn').onclick = searchByPhone;
$('#phone-search-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchByPhone(); });

function refreshAll() {
  loadDeliveries();
  loadCalls();
  loadSessionsOverview();
}

refreshAll();
setInterval(refreshAll, 4000);
</script>
</body>
</html>
