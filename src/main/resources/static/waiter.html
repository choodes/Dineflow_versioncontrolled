<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waiter Panel</title>
<style>
  :root{ --paper:#FAF6EE; --charcoal:#211F1C; --paprika:#C1440E; --herb:#2F5233; --stone:#8A8578; --line:#E4DDC9; --card:#FFFFFF; --amber:#B8860B; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--charcoal); font-family:system-ui,-apple-system,sans-serif;}
  header{background:var(--charcoal); color:var(--paper); padding:18px 24px; display:flex; justify-content:space-between; align-items:center;}
  header h1{margin:0; font-size:20px;}
  main{max-width:1000px; margin:0 auto; padding:20px;}
  h2{font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--stone); margin:26px 0 10px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; transition:box-shadow .15s ease, transform .15s ease;}
  .card:hover{box-shadow:0 3px 14px rgba(0,0,0,.08); transform:translateY(-1px);}
  .row{display:flex; justify-content:space-between; align-items:center;}
  .badge{padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600;}
  .badge.customer_call{background:#F8D7DA; color:#721C24;}
  .badge.payment_collect{background:#D4EDDA; color:#155724;}
  .badge.regular_check{background:#FFF3CD; color:#856404;}
  .badge.open{background:#F8D7DA;color:#721C24;} .badge.attending{background:#D1ECF1;color:#0C5460;}
  ul{margin:10px 0; padding-left:18px; font-size:14px;}
  .btn{border:none; border-radius:8px; padding:9px 14px; font-weight:600; cursor:pointer; font-size:13px;}
  .btn.herb{background:var(--herb); color:#fff;}
  .btn.paprika{background:var(--paprika); color:#fff;}
  .btn.stone{background:var(--stone); color:#fff;}
  .actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .empty{color:var(--stone); padding:20px 0; font-size:13px;}
  .table-tag{font-family:monospace; font-size:12px; color:var(--stone);}
  table{width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden;}
  th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); font-size:13px;}
  tbody tr{transition:background .12s ease;}
  tbody tr:hover{background:#F7F3E7;}
  tr.suspicious:hover{background:#FBDCD8;}
  th{background:#F1EAD8; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--stone);}
  tr.suspicious{background:#FDEDEC;}
  tr.suspicious td:first-child{border-left:4px solid #C0392B;}
  .flag{color:#C0392B; font-weight:700;}
  .search-row{display:flex; gap:8px; margin-bottom:14px;}
  .search-row input{flex:1; padding:9px; border:1px solid var(--line); border-radius:8px;}
</style>
</head>
<body>
<header><h1>🧑‍🍳 Waiter Panel</h1><a href="/logout" style="color:var(--paper);font-size:12px;opacity:.8;">Logout</a></header>
<main>
  <h2>Find a Bill by Phone Number</h2>
  <div class="search-row">
    <input id="phone-search-input" placeholder="Customer's 10-digit mobile number">
    <button class="btn herb" id="phone-search-btn">Search</button>
  </div>
  <div id="phone-search-results"></div>

  <h2>Tables Overview <span style="font-weight:400;color:var(--stone);font-size:11px;">— rows in red have had no new order for 25+ minutes and are still unpaid</span></h2>
  <table id="sessions-table">
    <thead><tr><th></th><th>Session</th><th>Table</th><th>Status</th><th>Pay Choice</th><th>Phone</th><th>Members</th><th>Since last order (min)</th><th>Total</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Ready to Deliver</h2>
  <div id="deliveries" class="grid"><div class="empty">Loading...</div></div>

  <h2>Waiter Calls &amp; Alerts</h2>
  <div id="calls" class="grid"><div class="empty">Loading...</div></div>
</main>

<script>
const $ = s => document.querySelector(s);
async function api(method, path, body){
  const res = await fetch(path, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined });
  if(!res.ok){
    let message = res.statusText;
    try{ const errBody = await res.json(); message = errBody.error || message; }catch(e){ /* not JSON, keep statusText */ }
    throw new Error(message);
  }
  const ct = res.headers.get('content-type')||'';
  return ct.includes('application/json') ? res.json() : null;
}

async function loadDeliveries(){
  const items = await api('GET', '/api/waiter/deliveries/ready');
  const box = $('#deliveries');
  if(!items.length){ box.innerHTML = '<div class="empty">✅ Nothing waiting for delivery right now.</div>'; return; }
  box.innerHTML = items.map(d => `
    <div class="card">
      <strong>Order #${d.orderId}</strong>
      <div class="table-tag">Session #${d.sessionId}</div>
      <ul>${d.items.map(i => `<li>${i.quantity} × ${i.nameSnapshot}</li>`).join('')}</ul>
      <div class="actions"><button class="btn herb" data-served="${d.orderId}">Mark Served</button></div>
    </div>
  `).join('');
  box.querySelectorAll('[data-served]').forEach(b => b.onclick = async () => {
    await api('POST', '/api/waiter/orders/' + b.dataset.served + '/served');
    loadDeliveries();
  });
}

const typeLabels = { CUSTOMER_CALL: '🔔 Customer called', PAYMENT_COLLECT: '💵 Ready to pay', REGULAR_CHECK: '⏰ 25-min check-in' };

async function loadCalls(){
  const calls = await api('GET', '/api/waiter/calls');
  const box = $('#calls');
  if(!calls.length){ box.innerHTML = '<div class="empty">🔕 No open calls at the moment.</div>'; return; }
  box.innerHTML = calls.map(c => `
    <div class="card">
      <div class="row">
        <strong>${typeLabels[c.type] || c.type}</strong>
        <span class="badge ${c.status.toLowerCase()}">${c.status}</span>
      </div>
      <div class="table-tag">Table #${c.tableId} · Session #${c.sessionId}</div>
      <div class="actions">
        ${c.status==='OPEN' ? `<button class="btn stone" data-attend="${c.id}">Attend</button>` : ''}
        ${c.type==='PAYMENT_COLLECT' ? `<button class="btn herb" data-paid="${c.id}">Mark Paid &amp; Close Bill</button>` : `<button class="btn paprika" data-resolve="${c.id}">Resolve</button>`}
      </div>
    </div>
  `).join('');
  box.querySelectorAll('[data-attend]').forEach(b => b.onclick = async () => { await api('POST', '/api/waiter/calls/'+b.dataset.attend+'/attend'); loadCalls(); });
  box.querySelectorAll('[data-paid]').forEach(b => b.onclick = async () => { await api('POST', '/api/waiter/calls/'+b.dataset.paid+'/mark-paid'); loadCalls(); });
  box.querySelectorAll('[data-resolve]').forEach(b => b.onclick = async () => {
    await api('POST', '/api/waiter/calls/'+b.dataset.resolve+'/resolve');
    loadCalls();
  });
}

// ---- Tables overview / idle unpaid sessions ----
async function loadSessionsOverview(){
  const sessions = await api('GET', '/api/waiter/sessions');
  const tbody = document.querySelector('#sessions-table tbody');
  if(!sessions.length){ tbody.innerHTML = '<tr><td colspan="9" class="empty">No open tables.</td></tr>'; return; }
  tbody.innerHTML = sessions.map(s => `
    <tr class="${s.needsAttention ? 'suspicious' : ''}">
      <td>${s.needsAttention ? '<span class="flag">⚠</span>' : ''}</td>
      <td>#${s.id}</td>
      <td>Table ${s.tableId}</td>
      <td>${s.status}</td>
      <td>${s.paymentChoice}</td>
      <td>${s.customerPhone || '—'}</td>
      <td>${s.partySize || '—'}</td>
      <td>${s.minutesSinceLastOrder}</td>
      <td class="price">₹${Number(s.total).toFixed(0)}</td>
    </tr>
  `).join('');
}

// ---- Phone search for counter bill pickup ----
async function searchByPhone(){
  const phone = document.getElementById('phone-search-input').value.trim();
  const box = document.getElementById('phone-search-results');
  if(!phone){ box.innerHTML = ''; return; }
  const results = await api('GET', '/api/waiter/sessions/search?phone=' + encodeURIComponent(phone));
  if(!results.length){ box.innerHTML = '<div class="empty">No open bill found for that number.</div>'; return; }
  box.innerHTML = results.map(s => `
    <div class="card ${s.needsAttention ? 'suspicious' : ''}">
      <div class="row"><strong>Table ${s.tableId} — Session #${s.id}</strong><span class="price">₹${Number(s.total).toFixed(0)}</span></div>
      <div class="table-tag">${s.status} · ${s.partySize || '?'} members · last order ${s.minutesSinceLastOrder} min ago</div>
    </div>
  `).join('');
}
document.getElementById('phone-search-btn').onclick = searchByPhone;
document.getElementById('phone-search-input').addEventListener('keydown', (e) => { if(e.key === 'Enter') searchByPhone(); });

function refreshAll(){ loadDeliveries(); loadCalls(); loadSessionsOverview(); }
refreshAll();
setInterval(refreshAll, 4000);
</script>
</body>
</html>
