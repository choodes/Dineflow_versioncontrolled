spring.application.name=qr-ordering-system
server.port=8080

# In-memory H2 database - resets every restart, no external DB needed to run this demo
spring.datasource.url=jdbc:h2:mem:qrordering;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console for inspecting data during development: http://localhost:8080/h2-console
# JDBC URL to use in the console: jdbc:h2:mem:qrordering
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.fail-on-empty-beans=false
